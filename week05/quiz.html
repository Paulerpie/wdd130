<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>HTML and CSS Quiz</h1>
    <form action="#" method="get">
        <div class="field">
            <label for="q1">1. Which HTML element is used to create a hyperlink?</label>
            <input type="text" name="q1" id="q1" placeholder="Type the element name">
        </div>

        <div class="field">
            <label for="q2">2. In your own words, what does the CSS box model describe?</label>
            <textarea name="q2" id="q2" rows="5"></textarea>
        </div>

        <div class="field">
            <label for="q3">3. Which CSS property changes the text color of an element?</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="font-color">font-color</option>
                <option value="color">color</option>
                <option value="text-style">text-style</option>
                <option value="foreground">foreground</option>
            </select>
        </div>

        <div class="field">
            <label for="q4">4. How many heading levels (h1 through h6) does HTML provide?</label>
            <input type="number" name="q4" id="q4" min="0" step="1">
        </div>

        <button type="submit">Submit Quiz</button>
    </form>
</body>

</html>
